# Refaz o gráfico de contribuições (assets/contribuicoes.svg) todo dia.
name: Contribuições

on:
  schedule:
    - cron: "17 6 * * *"   # 03:17 em Brasília
  workflow_dispatch:        # botão "Run workflow" na aba Actions
  push:
    branches: [main]
    paths: ["ferramentas/**", ".github/workflows/contribuicoes.yml"]

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install fonttools brotli
      - name: Gerar o gráfico
        run: python ferramentas/contribuicoes.py --login "${{ github.repository_owner }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # opcional: um token pessoal (secret CONTRIB_TOKEN) conta também as contribuições privadas
          CONTRIB_TOKEN: ${{ secrets.CONTRIB_TOKEN }}
      - name: Salvar se mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contribuicoes.svg
          git diff --cached --quiet || git commit -m "Atualiza o gráfico de contribuições"
          git push
